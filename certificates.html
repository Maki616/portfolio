<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates | Gian Jalandoni</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+U:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind for cert cards only -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div id="background"></div>

    <header id="Navigator">
        <a href="index.html" class="logo">GCJ</a>
        <nav id="Nav">
            <a href="about.html">About</a>
            <a href="certificates.html">Certificates</a>
            <a href="tech-stack.html">Tech Stack</a>
        </nav>
    </header>

    <section class="certifications">
        <h2>Certifications</h2>

        <div class="flex flex-wrap justify-center items-stretch gap-8 px-4">

            <div class="w-100 p-6 flex flex-col text-center bg-[#161616] rounded-2xl shadow-2xl shadow-white/20 hover:scale-105 transition duration-500 border border-white/20">
                <img src="images/PPTCert.jpg"
                    class="rounded-lg cursor-pointer w-full"
                    alt="PowerPoint Associate Certificate"
                    onclick="openModal(this.src)">
                <p class="flex items-center justify-center font-bold text-xl mt-2 h-14 whitespace-nowrap">PowerPoint Associate</p>
                <a href="https://www.certiport.com/portal/pages/credentialverification.aspx"
                    target="_blank"
                    class="inline-block mt-auto pt-1 px-5 py-1 border border-white text-white font-bold rounded-lg hover:bg-white hover:text-black transition duration-300">
                    Verify Certification
                </a>
            </div>

            <div class="w-100 p-6 flex flex-col text-center bg-[#161616] rounded-2xl shadow-2xl shadow-white/20 hover:scale-105 transition duration-500 border border-white/20">
                <img src="images/WordCert.jpg"
                    class="rounded-lg cursor-pointer w-full"
                    alt="MS Word Associate Certificate"
                    onclick="openModal(this.src)">
                <p class="flex items-center justify-center font-bold text-xl mt-2 h-14">MS Word Associate</p>
                <a href="https://www.certiport.com/portal/pages/credentialverification.aspx"
                    target="_blank"
                    class="inline-block mt-auto pt-1 px-5 py-1 border border-white text-white font-bold rounded-lg hover:bg-white hover:text-black transition duration-300">
                    Verify Certification
                </a>
            </div>

        </div>
    </section>

    <div id="imageModal" class="hidden" onclick="closeModal()">
        <img id="modalImg">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
